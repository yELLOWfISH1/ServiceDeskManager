[AD]
# LDAP Configuration
LDAP_SERVER = dc.yourdomain.com
LDAP_PORT = 389
LDAP_BASE_DN = DC=yourdomain,DC=com

# AD audit logging folder (relative paths are from project root)
LOG_FOLDER = logs

# Organizational Units with Friendly Names
# Format: FriendlyName:OU_DN_Path | FriendlyName:OU_DN_Path (separated by pipe |)
# Example: Workstations:OU=Workstations,OU=Computers,DC=yourdomain,DC=com | Servers:OU=Servers,OU=Computers,DC=yourdomain,DC=com
ORGANIZATIONAL_UNITS = Workstations:OU=Workstations,OU=Computers,DC=yourdomain,DC=com | Servers:OU=Servers,OU=Computers,DC=yourdomain,DC=com | Laptops:OU=Laptops,OU=Computers,DC=yourdomain,DC=com | Decommissioned:OU=Decommissioned,OU=Computers,DC=yourdomain,DC=com
